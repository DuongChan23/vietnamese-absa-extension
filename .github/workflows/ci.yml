name: CI

on:
  push:
    branches:
      - main
      - feature/domain-conditioned-inference
      - feature/auto-domain-detection
  pull_request:
    branches:
      - main
      - feature/domain-conditioned-inference
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: Python unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compile Python modules
        run: python -m compileall -q backend deploy
      - name: Run Python tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

  extension-tests:
    name: Chrome Extension tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check JavaScript syntax
        run: |
          node --check extension/popup.js
          node --check extension/background.js
          node --check extension/collectors/product_collector.js
          node --check extension/services/batch_service.js
      - name: Run Extension tests
        run: node --test tests/*.test.mjs
